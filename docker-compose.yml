# Local development only: Postgres + Redis on localhost ports. Run web/api with pnpm.
name: pod-dev
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: pod, POSTGRES_PASSWORD: pod, POSTGRES_DB: pod }
    ports: ["127.0.0.1:5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6381:6379"]
volumes:
  pgdata:
