# POD production stack on the shared VPS. Started by scripts/deploy.sh.
# Secrets come from /home/ubuntu/docker/websites/pod/.env (generated on first deploy, never in Git).
name: pod

x-api-env: &api-env
  NODE_ENV: production
  PORT: "4000"
  PUBLIC_BASE_URL: https://pod.supersoftltd.com
  DATABASE_URL: postgresql://pod:${POSTGRES_PASSWORD}@pod-postgres:5432/pod
  REDIS_URL: redis://:${REDIS_PASSWORD}@pod-redis:6379/0
  FILES_DIR: /data/files
  FILES_SIGNING_KEY: ${FILES_SIGNING_KEY:?set in .env}
  PRINTIFY_API_TOKEN: ${PRINTIFY_API_TOKEN:-}
  PRINTIFY_SHOP_ID: ${PRINTIFY_SHOP_ID:-}
  PRINTIFY_WEBHOOK_SECRET: ${PRINTIFY_WEBHOOK_SECRET:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
  SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
  SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
  SSLCOMMERZ_SANDBOX: ${SSLCOMMERZ_SANDBOX:-true}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}

services:
  pod-web:
    build: ../../apps/web
    image: pod-web:latest
    container_name: pod-web
    restart: unless-stopped
    mem_limit: 384m
    environment:
      API_INTERNAL_URL: http://pod-api:4000
    networks: [proxy]

  pod-api:
    build:
      context: ../../apps/api
      target: runtime
    image: pod-api:latest
    container_name: pod-api
    restart: unless-stopped
    mem_limit: 512m
    environment: *api-env
    volumes: ["../../../data:/data"]
    depends_on:
      pod-postgres: { condition: service_healthy }
      pod-redis: { condition: service_healthy }
    networks: [proxy, internal]

  pod-worker:
    image: pod-api:latest
    container_name: pod-worker
    restart: unless-stopped
    mem_limit: 384m
    command: ["node", "dist/worker.js"]
    environment: *api-env
    volumes: ["../../../data:/data"]
    healthcheck:
      disable: true
    depends_on:
      pod-api: { condition: service_started }
      pod-redis: { condition: service_healthy }
    networks: [internal]

  pod-postgres:
    image: postgres:16-alpine
    container_name: pod-postgres
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: pod
      POSTGRES_DB: pod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pod -d pod"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  pod-redis:
    image: redis:7-alpine
    container_name: pod-redis
    restart: unless-stopped
    mem_limit: 128m
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

volumes:
  pgdata:
  redisdata:

networks:
  proxy:
    external: true
  internal:
    name: pod_internal
